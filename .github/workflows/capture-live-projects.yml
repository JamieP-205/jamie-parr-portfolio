name: Capture live project screenshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'placement-portfolio-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/capture-live-projects.js
      - uses: actions/upload-artifact@v4
        with:
          name: live-project-screenshots
          path: tmp/live-project-screenshots/*.png
          if-no-files-found: error
